apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devops-demo
  namespace: devops-demo
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - devops-demo
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-demo
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
